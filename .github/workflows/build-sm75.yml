# Builds the Turing (sm_75) port for the NVIDIA Tesla T10 (TU102, 16 GB).
#
# GitHub-hosted runners have no GPU, but nvcc only needs to *compile* for sm_75, so the whole
# product builds here. The binaries are uploaded for the maintainer to download and run on the T10.
#
# The build runs inside NVIDIA's CUDA devel image so nothing is installed on the runner host beyond
# Docker. CUDA 13's minimum supported architecture is sm_75 (Turing), which is exactly the target.
#
# ccache is carried between runs (keyed by commit, restored from the newest matching cache) so an
# iteration that touches a few translation units recompiles only those instead of the whole tree.
name: build-sm75

on:
  push:
    branches: [sm75, 'sm75/**']
  workflow_dispatch:
    inputs:
      arch:
        description: CMAKE_CUDA_ARCHITECTURES to build
        required: false
        default: '75'
      cache_suffix:
        description: Bump to force a fresh ccache namespace
        required: false
        default: 'v1'

concurrency:
  group: build-sm75-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-sm75:
    name: CUDA build (sm_75, no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Disk before
        run: df -h /

      - uses: actions/checkout@v5

      - name: ccache location
        run: |
          echo "CCACHE_HOST_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccache"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-sm75-${{ github.event.inputs.cache_suffix || 'v1' }}-${{ github.sha }}
          restore-keys: |
            ccache-sm75-${{ github.event.inputs.cache_suffix || 'v1' }}-

      - name: Build sm_75
        env:
          ARCH: ${{ github.event.inputs.arch || '75' }}
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src" -v "$CCACHE_HOST_DIR:/ccache" -w /src \
            -e NINFER_CUDA_ARCH="$ARCH" -e NINFER_BUILD_DIR=/src/build-sm75 \
            -e NINFER_TESTS=OFF -e NINFER_MULTICALL=ON -e NINFER_JOBS=4 \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=6G -e CCACHE_COMPILERCHECK=content \
            nvidia/cuda:13.4.2-devel-ubuntu24.04 bash -c '
              set -eux
              apt-get update
              apt-get install --yes --no-install-recommends \
                ccache cmake ninja-build pkg-config git file rsync \
                libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
                libcurl4-openssl-dev zlib1g-dev python3 python3-jinja2
              cc="$(command -v gcc-13 || command -v gcc)"
              cxx="$(command -v g++-13 || command -v g++)"
              export CC="$cc" CXX="$cxx" CUDAHOSTCXX="$cxx"
              ccache --zero-stats
              # -k 0 keeps going so one run surfaces every compile error, not just the first.
              scripts/build-native.sh configure
              cmake --build "$NINFER_BUILD_DIR" --parallel "$NINFER_JOBS" -- -k 0
              ccache --show-stats
            ' 2>&1 | tee build-sm75.log

      - name: Summarize compile errors
        if: always()
        run: |
          echo "## sm_75 build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error:|FAILED:" build-sm75.log | sort -u | head -300 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error:" build-sm75.log | sort -u | head -120 || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-sm75-${{ github.event.inputs.cache_suffix || 'v1' }}-${{ github.sha }}

      - name: Stage binaries
        if: always()
        run: |
          mkdir -p dist
          for f in ninfer ninfer-serve ninfer-perplexity ninfer-calibrate ninfer-multicall; do
            if [ -e "build-sm75/apps/$f" ]; then cp -a "build-sm75/apps/$f" dist/; fi
          done
          ls -la dist || true

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-sm75
          path: dist/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-sm75-log
          path: build-sm75.log
          if-no-files-found: warn
          retention-days: 14
